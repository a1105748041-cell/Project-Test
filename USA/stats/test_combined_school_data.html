<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试合并学校数据</title>
    <script src="university_deadlines.js"></script>
    <script src="school_programs_data.js"></script>
    <script src="combined_school_data.js"></script>
</head>
<body>
    <h1>测试合并学校数据</h1>
    <div id="test-result"></div>

    <script>
        // 等待DOM加载完成
        document.addEventListener('DOMContentLoaded', function() {
            const resultDiv = document.getElementById('test-result');
            
            // 检查combinedSchoolData是否存在
            if (window.combinedSchoolData) {
                resultDiv.innerHTML += '<h2>✅ combinedSchoolData存在</h2>';
                
                // 检查密歇根大学的数据
                const michiganData = window.combinedSchoolData['密歇根大学安娜堡分校'];
                if (michiganData) {
                    resultDiv.innerHTML += '<h2>✅ 找到密歇根大学安娜堡分校的数据</h2>';
                    resultDiv.innerHTML += '<pre>' + JSON.stringify(michiganData, null, 2) + '</pre>';
                    
                    // 检查deadlines
                    if (michiganData.deadlines) {
                        resultDiv.innerHTML += '<h3>截止日期信息：</h3>';
                        resultDiv.innerHTML += '<p>ED: ' + michiganData.deadlines.ED + '</p>';
                        resultDiv.innerHTML += '<p>EDII: ' + michiganData.deadlines.EDII + '</p>';
                        resultDiv.innerHTML += '<p>EA: ' + michiganData.deadlines.EA + '</p>';
                        resultDiv.innerHTML += '<p>RD: ' + michiganData.deadlines.RD + '</p>';
                    } else {
                        resultDiv.innerHTML += '<h3>❌ 没有截止日期信息</h3>';
                    }
                } else {
                    resultDiv.innerHTML += '<h2>❌ 没有找到密歇根大学安娜堡分校的数据</h2>';
                    
                    // 显示所有可用的学校名称
                    resultDiv.innerHTML += '<h3>可用的学校名称：</h3>';
                    const schoolNames = Object.keys(window.combinedSchoolData);
                    schoolNames.forEach(name => {
                        resultDiv.innerHTML += '<p>' + name + '</p>';
                    });
                }
                
                // 检查universityDeadlines
                resultDiv.innerHTML += '<h2>universityDeadlines数据：</h2>';
                resultDiv.innerHTML += '<pre>' + JSON.stringify(window.universityDeadlines, null, 2) + '</pre>';
                
                // 检查universityPrograms
                resultDiv.innerHTML += '<h2>universityPrograms中的密歇根大学：</h2>';
                const programData = window.universityPrograms['密歇根大学安娜堡分校'];
                if (programData) {
                    resultDiv.innerHTML += '<pre>' + JSON.stringify(programData, null, 2) + '</pre>';
                } else {
                    resultDiv.innerHTML += '<p>❌ universityPrograms中没有密歇根大学安娜堡分校的数据</p>';
                }
            } else {
                resultDiv.innerHTML += '<h2>❌ combinedSchoolData不存在</h2>';
            }
        });
    </script>
</body>
</html>
