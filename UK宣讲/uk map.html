<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>英国名校互动地图</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="uk-map.css">
</head>

<body>
  <div id="map"></div>
  <div id="sidebar">
    <button id="close-btn">关闭</button>
    <div id="info">
      <h2>英国名校</h2>
      <p>请选择一所学校以查看详细信息。</p>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // 设置英国地图中心点和缩放级别
    var map = L.map('map').setView([52.8, -1.3], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 12, minZoom: 5, attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let sidebarLocked = false;
    let hoverCard;

    function showPreview(props) {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.add('active', 'preview');
      document.getElementById('info').innerHTML = `
    <div class="school-card preview">
      <img src="${props.img}" alt="${props.name}">
      <div class="school-details preview">
        <h2>${props.name}</h2>
        <div class="school-grid preview">
          <div class="grid-label">Ranking:</div><div>${props.ranking}</div>
        </div>
      </div>
    </div>
  `;
    }

    function showFull(props) {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.add('active');
      sidebar.classList.remove('preview');
      
      // 为所有学校显示基本信息
      let htmlContent = `
    <div class="school-container">
      <!-- 保持图片和原有内容的水平布局 -->
      <div class="school-card">
        <img src="${props.img}" alt="${props.name}">
        <div class="school-details">
            <h2>${props.name}</h2>
            <div class="school-grid">
            <div class="school-row">
            <div class="grid-label">2026申请人数:</div>
            <div class="grid-value">${props.applications}</div>
          </div>
          <div class="school-row">
            <div class="grid-label">2026录取人数:</div>
            <div class="grid-value">${props.admissions}</div>
          </div>
          <div class="school-row">
            <div class="grid-label">排名</div>
            <div class="grid-value">${props.ranking}</div>
          </div>
        </div>

          <p class="school-link"><a href="${props.website}" target="_blank">${props.website}</a></p>
        </div>
      </div>
      
      <!-- 图片和原有内容下方新增的学校信息 -->
      <div class="school-additional-info">
        <h3>学校信息</h3>
        <div class="school-row">
          <div class="grid-label">热门专业</div>
          <div class="grid-value">${props.popularMajors}</div>
        </div>
        <div class="school-row">
          <div class="grid-label">学费</div>
          <div class="grid-value">${props.tuition}</div>
        </div>
      </div>`;
      
      // 如果是UCL，添加数据可视化部分
      if (props.name.includes("UCL") || props.name.includes("伦敦大学学院")) {
        htmlContent += `
      <!-- UCL申请数据可视化部分 -->
      <div class="ucl-data-visualization">
        <h3>UCL申请数据分析</h3>
        <div class="charts-container">
          <div class="chart-wrapper">
            <h4>各学院申请与录取人数对比</h4>
            <canvas id="facultyChart" width="400" height="300"></canvas>
          </div>
          <div class="chart-wrapper">
            <h4>专业竞争激烈程度</h4>
            <canvas id="competitivenessChart" width="400" height="300"></canvas>
          </div>
        </div>
      </div>`;
      }
      
      htmlContent += `
    </div>`;
      
      document.getElementById('info').innerHTML = htmlContent;
      
      // 如果是UCL，加载数据并创建图表
      if (props.name.includes("UCL") || props.name.includes("伦敦大学学院")) {
        fetch('ucl_apps_data.json')
          .then(res => res.json())
          .then(data => {
            createUCLCharts(data);
          })
          .catch(err => console.error('加载UCL数据失败:', err));
      }
    }
    
    // 创建UCL数据可视化图表
    function createUCLCharts(data) {
      // 1. 按学院统计数据
      const facultyStats = {};
      data.forEach(item => {
        if (!facultyStats[item.Faculty]) {
          facultyStats[item.Faculty] = {
            Apps: 0,
            Offers: 0,
            Places: 0
          };
        }
        facultyStats[item.Faculty].Apps += item.Apps;
        facultyStats[item.Faculty].Offers += item.Offers;
        facultyStats[item.Faculty].Places += item.Places;
      });
      
      const faculties = Object.keys(facultyStats);
      const appsData = faculties.map(faculty => facultyStats[faculty].Apps);
      const offersData = faculties.map(faculty => facultyStats[faculty].Offers);
      
      // 2. 创建学院申请与录取对比柱状图
      const facultyCtx = document.getElementById('facultyChart').getContext('2d');
      new Chart(facultyCtx, {
        type: 'bar',
        data: {
          labels: faculties,
          datasets: [
            {
              label: '申请人数',
              data: appsData,
              backgroundColor: 'rgba(54, 162, 235, 0.7)',
              borderColor: 'rgba(54, 162, 235, 1)',
              borderWidth: 1
            },
            {
              label: '录取人数',
              data: offersData,
              backgroundColor: 'rgba(75, 192, 192, 0.7)',
              borderColor: 'rgba(75, 192, 192, 1)',
              borderWidth: 1
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true
            }
          },
          plugins: {
            legend: {
              position: 'top',
            }
          }
        }
      });
      
      // 3. 按竞争激烈程度排序(Apps per place)
      const competitiveData = data
        .filter(item => item['Apps per place'] > 0)
        .sort((a, b) => b['Apps per place'] - a['Apps per place'])
        .slice(0, 10); // 只显示竞争最激烈的10个专业
      
      const programNames = competitiveData.map(item => item.Programme);
      const competitionData = competitiveData.map(item => item['Apps per place']);
      
      // 4. 创建专业竞争激烈程度条形图
      const competitivenessCtx = document.getElementById('competitivenessChart').getContext('2d');
      new Chart(competitivenessCtx, {
        type: 'bar',
        data: {
          labels: programNames,
          datasets: [
            {
              label: '平均每名额申请人数',
              data: competitionData,
              backgroundColor: 'rgba(255, 99, 132, 0.7)',
              borderColor: 'rgba(255, 99, 132, 1)',
              borderWidth: 1
            }
          ]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: {
              beginAtZero: true
            }
          },
          plugins: {
            legend: {
              position: 'top',
            }
          }
        }
      });
    }

    fetch("uk-universities.geojson")
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          pointToLayer: (feature, latlng) => L.marker(latlng),
          onEachFeature: (feature, layer) => {
            layer.on("mouseover", () => {
              if (!sidebarLocked) {
                if (hoverCard) map.closePopup(hoverCard);
                const html = `
            <div class="hover-card">
              <img src="${feature.properties.img}" alt="${feature.properties.name}">
              <h4>${feature.properties.name}</h4>
              <p>排名：${feature.properties.ranking} </p>
            </div>
          `;
                hoverCard = L.popup({
                  offset: [20, -30],
                  autoClose: false,
                  closeButton: false,
                  className: 'hover-popup'
                })
                  .setLatLng([feature.geometry.coordinates[1], feature.geometry.coordinates[0]])
                  .setContent(html)
                  .openOn(map);
              }
            });

            layer.on("mouseout", () => {
              if (hoverCard) map.closePopup(hoverCard);
            });

            layer.on("click", () => {
              sidebarLocked = true;
              showFull(feature.properties);
            });
          }
        }).addTo(map);
      });

    document.getElementById('close-btn').onclick = function () {
      document.getElementById('sidebar').classList.remove('active', 'preview');
      sidebarLocked = false;
    };

    map.on('click', function () {
      document.getElementById('sidebar').classList.remove('active', 'preview');
      sidebarLocked = false;
    });
  </script>
</body>

</html>
